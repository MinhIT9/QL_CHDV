{% extends 'base.html' %}
{% block title %}Đổi mật khẩu · CHDV Manager{% endblock %}
{% block content %}
<header class="page-header"><div><p class="eyebrow">BẢO MẬT TÀI KHOẢN</p><h1>Đổi mật khẩu</h1><p class="muted">{{ 'Bạn cần đổi mật khẩu trước khi sử dụng ứng dụng.' if current_user.must_change_password else 'Cập nhật mật khẩu cho tài khoản của bạn.' }}</p></div></header>
<section class="card narrow"><form method="post" class="stack d-grid">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Mật khẩu hiện tại<input class="form-control" type="password" name="current_password" autocomplete="current-password" required maxlength="128"></label>
  <label>Mật khẩu mới<input class="form-control" type="password" name="new_password" autocomplete="new-password" required minlength="8" maxlength="128"><small>Từ 8 đến 128 ký tự, khác mật khẩu hiện tại.</small></label>
  <label>Xác nhận mật khẩu mới<input class="form-control" type="password" name="confirm_password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
  <button class="button primary btn btn-primary" type="submit">Lưu mật khẩu mới</button>
</form></section>
{% endblock %}
