<label>Thu tiền kỳ này<select class="form-select" name="payment">{% for value, label in [('all','Tất cả'),('unpaid','Chưa thu'),('paid','Đã thu'),('unbilled','Chưa chốt')] %}<option value="{{ value }}" {{ 'selected' if payment == value }}>{{ label }}</option>{% endfor %}</select></label>
<label>Cột hiển thị<select class="form-select" name="view"><option value="compact" {{ 'selected' if not full_view }}>Gọn · theo dõi thu</option><option value="full" {{ 'selected' if full_view }}>Đầy đủ · giá & hợp đồng</option></select></label>
