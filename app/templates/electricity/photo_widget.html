<div class="meter-photo-widget" data-upload-url="{{ url_for('photos.add', kind='electricity', owner_id=reading.id) if reading else '' }}">
  <div class="saved-photos">{% if reading %}{{ photo_list(reading.photos) }}{% endif %}</div>
  <label class="photo-drop border rounded p-2 d-block small text-muted" tabindex="0">
    Kéo ảnh vào đây hoặc chọn ảnh
    <input class="form-control form-control-sm meter-photo" type="file" name="{{ 'photo_' ~ room.id if room is defined else 'photo' }}" accept="image/jpeg,image/png,image/webp">
  </label>
  <div class="photo-preview d-flex align-items-center gap-2 my-2"></div>
  <button class="btn btn-sm btn-outline-primary photo-clear" type="button" hidden>Bỏ ảnh đang chọn</button>
  {% if reading %}<button class="btn btn-sm btn-primary photo-save" type="button" hidden>Lưu ảnh</button>{% endif %}
  <progress class="photo-progress w-100" max="100" value="0" hidden></progress>
  <div class="photo-message small" role="status" aria-live="polite"></div>
</div>
