<td>
  {% if reading %}
    {{ photo_list(reading.photos) }}
    <a class="small" href="{{ url_for('rooms.detail', room_id=room.id) }}">Bổ sung ảnh</a>
  {% elif not row.error %}
    <input class="form-control form-control-sm meter-photo" type="file" name="photo_{{ room.id }}" accept="image/jpeg,image/png,image/webp" aria-label="Ảnh chốt điện phòng {{ room.code }}">
  {% else %}—{% endif %}
</td>
